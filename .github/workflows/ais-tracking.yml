name: Seguimiento AIS gratuito

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      discord_test:
        description: Enviar a Discord una prueba de los buques vigilados actualmente
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swiftport-ais-tracking
  cancel-in-progress: true

jobs:
  track-vessels:
    name: Actualizar posiciones de buques
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consultar AISStream
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CRON_TOKEN: ${{ secrets.APP_SETUP_TOKEN }}
          APP_URL: https://app.swiftportlogistic.com
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST_SNAPSHOT: ${{ inputs.discord_test || 'false' }}
        run: node scripts/aisstream-sync.mjs
